<style>
:root{
  --bg:#eceae3; --card:#fff; --soft:#f5f4f0; --line:#e0ddd6; --line2:#d0cec8;
  --txt:#1c1c1a; --muted:#7a7975; --faint:#9b9b98;
  --blue:#0f4c81; --blue-bg:#e4eef8; --blue-txt:#0b3a63;
  --green:#3b6d11; --green-bg:#eaf3de; --green-txt:#27500a;
  --yellow:#ba7517; --yellow-bg:#faeeda; --yellow-txt:#633806;
  --red:#c43030; --red-bg:#fcebeb; --red-txt:#a32d2d;
  --gray-bg:#f0ede8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
#app{max-width:1280px;margin:0 auto;padding:18px 24px 60px}
input,select,textarea,button{font-family:inherit;font-size:13px;color:var(--txt);outline:none}
input,select,textarea{background:#fff;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
input:focus,select:focus,textarea:focus{border-color:#378add;box-shadow:0 0 0 3px rgba(55,138,221,.12)}
textarea{resize:vertical}
button{cursor:pointer;background:#fff;border:1px solid #c8c6c0;border-radius:7px;padding:5px 12px;white-space:nowrap}
button:hover{background:var(--soft)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)} .btn-p:hover{background:#0b3d69}
.btn-d{color:var(--red-txt);border-color:#e4b5b5} .btn-d:hover{background:var(--red-bg)}
.btn-s{padding:3px 9px;font-size:12px}
.link{background:none;border:none;padding:0;color:var(--txt);font-weight:600;text-align:left;cursor:pointer}
.link:hover{color:var(--blue);text-decoration:underline;background:none}

/* ── estrutura: menu lateral fixo + conteúdo ─────────────────── */
:root{--sw:248px;--side-bg:#0f2740;--side-bg2:#18365a;--side-txt:#cdd8e4;--side-faint:#8fa3b8;--marca:#003963}
body{padding-left:var(--sw);transition:padding-left .15s}
body.side-mini{--sw:64px}
body.no-side{padding-left:0} body.no-side #side{display:none}
#side{position:fixed;top:0;left:0;bottom:0;width:var(--sw);background:var(--side-bg);color:var(--side-txt);display:flex;flex-direction:column;z-index:40;transition:width .15s,transform .2s}
.nv-top{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:14px 12px 12px 14px;border-bottom:1px solid #21406a;flex:none}
.nv-brand{display:flex;align-items:center;gap:10px;min-width:0;font-size:13px;line-height:1.25;color:#fff}
.nv-brand span span{font-size:11px;color:var(--side-faint)}
.nv-logo{width:36px;height:36px;border-radius:9px;background:#fff;color:var(--marca);display:flex;align-items:center;justify-content:center;flex:none;padding:0 3px}
.nv-logo svg{width:100%;height:auto;display:block}
.marca-topo{text-align:center;margin:-2px 0 16px} .marca-topo svg{width:210px;max-width:70%;height:auto;color:var(--marca);display:block;margin:0 auto;aspect-ratio:449/334}
.marca-topo div{font-size:12.5px;color:var(--muted);margin-top:8px;letter-spacing:.02em}
.nv-mini{background:transparent;border:1px solid #2b4c74;color:var(--side-faint);padding:2px 8px;font-size:13px;border-radius:6px}
.nv-mini:hover{background:var(--side-bg2);color:#fff}
.nv-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 8px 16px;scrollbar-width:thin;scrollbar-color:#34577f transparent}
.nv-scroll::-webkit-scrollbar{width:8px} .nv-scroll::-webkit-scrollbar-thumb{background:#34577f;border-radius:8px}
.nv-g{margin-bottom:6px}
.nv-gt{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--side-faint);padding:12px 10px 5px}
.nv-item{display:flex;align-items:center;border-radius:8px;position:relative}
.nv-item:hover{background:var(--side-bg2)}
.nv-item.on{background:#1f4470} .nv-item.on::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:#5b9be8}
.nv-a{flex:1;display:flex;align-items:center;gap:11px;background:transparent;border:none;color:inherit;padding:8px 10px;font-size:13.5px;text-align:left;min-width:0;border-radius:8px}
.nv-a:hover{background:transparent;color:#fff} .nv-item.on .nv-a{color:#fff;font-weight:600}
.nv-a svg{flex:none;opacity:.9}
.nv-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nv-tg{background:transparent;border:none;color:var(--side-faint);padding:4px 9px;font-size:12px}
.nv-tg:hover{background:transparent;color:#fff}
.nv-subs{margin:2px 0 6px 21px;padding-left:10px;border-left:1px solid #2b4c74}
.nv-s{display:flex;align-items:center;gap:7px;width:100%;background:transparent;border:none;color:var(--side-txt);padding:5px 8px;font-size:12.5px;text-align:left;border-radius:6px}
.nv-s:hover{background:var(--side-bg2);color:#fff} .nv-s.on{background:#24497a;color:#fff;font-weight:600}
.nv-sh{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--side-faint);padding:7px 8px 2px}
.nv-dot{width:7px;height:7px;border-radius:50%;flex:none}
.nv-n{font-size:10.5px;font-weight:700;min-width:19px;height:18px;padding:0 5px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:#2a4b73;color:#e3ebf3}
.nv-n.bad{background:#c43030;color:#fff} .nv-n.warn{background:#ba7517;color:#fff} .nv-n.info{background:#1a5ca8;color:#fff}
.nv-foot{flex:none;border-top:1px solid #21406a;padding:10px 12px 12px;font-size:12px}
.nv-user{display:flex;align-items:center;gap:9px;line-height:1.3;color:#fff;margin-bottom:6px}
.nv-user .av{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:none}
.nv-user span span{color:var(--side-faint);font-size:11px}
.nv-mode{font-size:11px;color:#e3b565;margin-bottom:8px} .nv-mode.online{color:#8fd18b}
.nv-btn{width:100%;background:transparent;border:1px solid #2b4c74;color:var(--side-txt);font-size:12px;padding:5px}
.nv-btn:hover{background:var(--side-bg2);color:#fff}
/* menu recolhido: só ícones */
body.side-mini .nv-l,body.side-mini .nv-gt,body.side-mini .nv-subs,body.side-mini .nv-tg,body.side-mini .nv-mode,body.side-mini .nv-btn{display:none}
body.side-mini .nv-top{flex-direction:column;padding:12px 8px} body.side-mini .nv-a{justify-content:center;padding:10px 0}
body.side-mini .nv-n{position:absolute;top:2px;right:4px;min-width:16px;height:15px;font-size:9.5px}
body.side-mini .nv-user{justify-content:center}
/* barra superior do conteúdo */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #dedad2}
.crumb{flex:1;display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700;min-width:0}
.crumb-a{font-size:19px;font-weight:600;color:var(--muted)} .crumb-s{color:#b5b2ab;font-weight:400}
.crumb-c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}
.hamb{display:none;font-size:18px;padding:3px 10px}
#nav-backdrop{display:none}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border-radius:16px;padding:4px 12px;font-size:12px}
.chip.on{background:var(--txt);color:#fff;border-color:var(--txt)}
@media (max-width:900px){
  body,body.side-mini{padding-left:0;--sw:264px}
  #side{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.35)}
  body.nav-open #side{transform:none}
  body.nav-open #nav-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
  body.side-mini .nv-l,body.side-mini .nv-gt,body.side-mini .nv-subs,body.side-mini .nv-tg,body.side-mini .nv-mode,body.side-mini .nv-btn{display:revert}
  .nv-mini{display:none}
  .hamb{display:inline-block}
  .crumb,.crumb-a{font-size:16px}
}

/* layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.metric{background:var(--soft);border-radius:9px;padding:11px 13px}
.metric .k{font-size:11px;color:var(--muted);margin-bottom:4px}
.metric .v{font-size:21px;font-weight:650}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px} .bold{font-weight:650}
.empty{padding:14px;color:var(--faint);font-style:italic;font-size:12.5px}
.note{font-size:12px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 10px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto;min-width:180px}
.mt{margin-top:12px} .mb{margin-bottom:12px}

/* badges */
.b{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid transparent;white-space:nowrap;line-height:1.5}
.b-green{background:var(--green-bg);color:var(--green-txt);border-color:#b7d69a}
.b-yellow{background:var(--yellow-bg);color:var(--yellow-txt);border-color:#efd29a}
.b-red{background:var(--red-bg);color:var(--red-txt);border-color:#eeb4b4}
.b-blue{background:var(--blue-bg);color:var(--blue-txt);border-color:#a9caed}
.b-gray{background:var(--gray-bg);color:#666;border-color:#dedad2}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid #eeebe5;vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#faf9f6}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.total td{font-weight:700;border-top:1.5px solid var(--txt)}
.tw{overflow-x:auto}

/* matrix */
.mx td{padding:3px;text-align:center}
.cell{width:100%;min-width:72px;font-size:11px;padding:5px 4px;border-radius:7px;border:1px solid #dedad2;line-height:1.2;white-space:normal}
.loadpill{font-weight:700;border-radius:6px;padding:3px 7px;display:inline-block;min-width:48px;text-align:center}

/* gantt */
.gantt{position:relative}
.g-row{display:flex;align-items:center;min-height:28px}
.g-lbl{width:120px;flex:none;font-size:12px;font-weight:600;padding-right:8px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-trk{position:relative;flex:1;height:24px;background:#f3f1ec;border-radius:5px}
.g-bar{position:absolute;top:2px;height:20px;border-radius:5px;border:1px solid;font-size:10.5px;padding:2px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.g-now{position:absolute;top:-3px;bottom:-3px;width:2px;background:#e24b4a;z-index:2}
.g-hdr{position:relative;flex:1;height:18px}
.g-yr{position:absolute;top:0;font-size:11px;font-weight:600;color:var(--muted);border-left:1px solid #d6d3cc;padding-left:4px;height:100%}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,20,18,.42);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:50;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:980px}
.modal h3{font-size:16px;margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fgrid .full{grid-column:1/-1}
.fl{font-size:11.5px;color:var(--muted);margin-bottom:3px;display:block}
.fl .req{color:var(--red)}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 0}
.checks label{display:flex;gap:5px;align-items:center;font-size:12.5px}
.mactions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mactions .left{margin-right:auto}
.merr{background:var(--red-bg);color:var(--red-txt);border:1px solid #eeb4b4;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:10px}
.help{font-size:11px;color:var(--faint);margin-top:2px}

/* flash */
#flash{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c1c1a;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:80;display:none;max-width:90vw}
#flash.err{background:var(--red)}

/* página do projeto: abas */
.ptabs{display:flex;gap:2px;border-bottom:1px solid #dedad2;margin-bottom:14px;overflow-x:auto}
.ptab{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;padding:7px 12px;color:var(--muted);font-size:13px;margin-bottom:-1px;display:inline-flex;align-items:center;white-space:nowrap;flex-shrink:0}
.ptab:hover{background:var(--soft);color:var(--txt)} .ptab.on{color:var(--txt);border-bottom-color:var(--blue);font-weight:600}
.fsec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);border-bottom:1px solid var(--line);padding:8px 0 3px;margin-top:4px}
.crtg{cursor:pointer;display:inline-block;width:14px;color:var(--muted)} .crtg:hover{color:var(--txt)}
/* orçamento */
.pbar{display:inline-block;width:70px;height:7px;background:#ebe8e1;border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:5px}
.pbar span{display:block;height:100%;border-radius:4px}
table.orc td{padding:5px 8px;vertical-align:middle} table.orc tr.grp td{background:#f6f4ef;font-weight:700}
table.orc tr.grp0 td{background:#ecebe5} table.orc td.cod{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
table.orc input.cin{width:130px;text-align:right;padding:4px 7px;font-variant-numeric:tabular-nums}
table.orc td.warn{background:#fff6e5} table.orc td.bad{background:#fdecec}
table.orc .execlink{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
/* misc */
.tag{display:inline-block;background:#f2f1ed;border:1px solid #e3e0da;border-radius:5px;font-size:11px;padding:1px 6px;margin:1px}
.pcard .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv .k{color:var(--muted)}
.task{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid #eeebe5}
.task.done .tt{text-decoration:line-through;color:var(--faint)}
.task .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.alert{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:8px;font-size:12.5px;margin-bottom:5px}
.alert.bad{background:var(--red-bg);color:var(--red-txt)} .alert.warn{background:var(--yellow-bg);color:var(--yellow-txt)} .alert.ok{background:var(--green-bg);color:var(--green-txt)}
.scale{display:flex;justify-content:space-between;font-size:10px;color:var(--faint)}
.crit{padding:6px 0;border-bottom:1px dashed #eee}
.crit .top{display:flex;gap:8px;align-items:center;font-size:12.5px}
.crit .top .lbl{flex:1} .crit .val{font-weight:700;width:18px;text-align:right}
input[type=range]{padding:0;border:none;box-shadow:none}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:4px 10px;font-size:12px}
.seg button.pass{background:var(--green-bg);color:var(--green-txt);font-weight:700}
.seg button.fail{background:var(--red-bg);color:var(--red-txt);font-weight:700}
.week{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:11.5px}
.week>div{background:#fff;padding:5px;min-height:38px}
.week .wh{background:var(--soft);font-weight:600;color:var(--muted);text-align:center;min-height:0}
.week .wi{font-weight:600;background:#faf9f6}
.rv{display:block;border-radius:5px;padding:2px 5px;margin-bottom:2px;cursor:pointer;font-size:10.5px;line-height:1.3}
.rv.sol{background:var(--yellow-bg);border:1px dashed #d9a441;color:var(--yellow-txt)}
.rv.conf{background:var(--blue-bg);border:1px solid #a9caed;color:var(--blue-txt)}
.rv.real{background:var(--green-bg);border:1px solid #b7d69a;color:var(--green-txt)}
.tree-child{padding-left:22px;position:relative}
.tree-child::before{content:'└';position:absolute;left:8px;color:#c8c6c0}

/* report */
#report{position:fixed;inset:0;background:#e6e4dd;z-index:60;overflow-y:auto;padding:20px}
#report .bar{max-width:880px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap}
#report .paper{max-width:880px;margin:0 auto;background:#fff;padding:36px 44px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
#report h1{font-size:22px} #report h2{font-size:16px;border-bottom:1.5px solid #1c1c1a;margin:22px 0 8px;padding-bottom:3px}
#report h3{font-size:13.5px;margin:12px 0 4px} #report p{margin:5px 0;font-size:13px}
#report table{width:100%;border-collapse:collapse;margin:6px 0;font-size:12px}
#report td,#report th{border:1px solid #bbb;padding:4px 7px;text-align:left;vertical-align:top}
#report th{background:#f0ede8}
@media print{
  body{padding-left:0!important} #side{display:none!important}
  body.printing #app,body.printing #side,body.printing #modal-root,body.printing #report .bar{display:none!important}
  body.printing #report{position:static;padding:0;background:#fff}
  body.printing #report .paper{box-shadow:none;padding:0;max-width:none}
}
@media (max-width:640px){ .fgrid{grid-template-columns:1fr} .g-lbl{width:78px} }

/* abertura e quadro "Sobre" */
#abertura{position:fixed;inset:0;z-index:2000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;transition:opacity .45s ease;cursor:pointer}
#abertura.saindo{opacity:0;pointer-events:none}
.sobre{max-width:560px;text-align:center;color:var(--muted);font-size:12px;line-height:1.55}
#abertura .sobre{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:34px 38px 26px;box-shadow:0 10px 40px rgba(0,57,99,.08)}
.sobre .marca-logo{width:230px;max-width:70%;height:auto;color:var(--marca);display:block;margin:0 auto;overflow:visible;aspect-ratio:449/334}
.sobre h2{font-size:15px;color:var(--marca);margin:16px 0 4px;font-weight:700}
.sobre .copy{font-size:11.5px;margin-bottom:12px}
.sobre .aviso{font-size:10.8px;text-align:justify;color:var(--faint);margin:0 0 14px;hyphens:auto}
.sobre dl{display:grid;grid-template-columns:auto auto;justify-content:center;gap:3px 8px;margin:0 0 14px}
.sobre dt{text-align:right;color:var(--faint)} .sobre dd{margin:0;text-align:left;color:var(--txt)}
.sobre a{color:var(--blue)}
.sobre .rodape{font-size:11px;color:var(--faint);border-top:1px solid var(--line);padding-top:10px}
.sobre .barra{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:14px}
.sobre .barra i{display:block;height:100%;width:0;background:var(--marca);animation:carregar 1s linear forwards}
@keyframes carregar{to{width:100%}}
.sobre-cfg{display:flex;gap:28px;align-items:center;text-align:left;max-width:none}
.sobre-cfg .marca-logo{width:190px;flex:none}
.sobre-cfg dl{justify-content:start} .sobre-cfg .copy{margin-bottom:8px} .sobre-cfg h2{margin-top:0}
@media (max-width:700px){.sobre-cfg{flex-direction:column;text-align:center}.sobre-cfg dl{justify-content:center}}
</style>

  candidatos: { all: r => Perm.gereCandidatos(r.projeto_id) },

  pessoa_checklist: { all: r => Perm.gerePessoa(r.pessoa_id) },
  documentos: { ins: n => Perm.gereProjeto(n.projeto_id) || (Perm.incluiDoc(n.projeto_id) && !n.restrito), upd: (n, o) => Perm.editaDoc(o) && (Perm.gereProjeto(o.projeto_id) || !n.restrito), del: (n, o) => Perm.editaDoc(o) },
  pendencias: { ins: n => Perm.gereProjeto(n.projeto_id), upd: (n, o) => Perm.editaPendencia(o), del: (n, o) => Perm.gereProjeto(o.projeto_id) },
  entregas: { ins: n => Perm.gereProjeto(n.projeto_id), upd: (n, o) => Perm.editaEntrega(o), del: (n, o) => Perm.gereProjeto(o.projeto_id) },
  gerencias: { all: () => Perm.dir() }, gerencia_membros: { all: () => Perm.dir() }, rubricas: { all: () => Perm.dir() },
  tarefas: {

  tarefa_responsaveis: { all: r => { const t = byId('tarefas', r.tarefa_id); return !!t && Perm.gereTarefa(t); } },
  vinculos_financeiros: { all: r => Perm.editaFin(r.projeto_id) },

  prospeccoes: { ins: () => Perm.gereProspeccao(), upd: () => Perm.gereProspeccao(), del: () => Perm.dir() },
  avaliacoes: { ins: () => Perm.gereProspeccao(), upd: () => false, del: () => Perm.dir() },
  historico: { all: () => true },
  infra_itens: { ins: () => Perm.gereInfraGeral(), upd: (n, o) => Perm.gereInfra(o.id), del: () => Perm.gereInfraGeral() },
  infra_habilitacoes: { all: r => Perm.gereInfra(r.item_id) },
  infra_reservas: { ins: () => Perm.podeEditar(), upd: (n, o) => Perm.gereInfra(o.item_id) || (Perm.podeEditar() && o.criado_por === ME.uid), del: (n, o) => Perm.gereInfra(o.item_id) },
  infra_manutencoes: { ins: n => Perm.gereInfra(n.item_id) || (Perm.podeEditar() && n.tipo === 'corretiva' && n.status === 'planejada'), upd: (n, o) => Perm.gereInfra(o.item_id), del: (n, o) => Perm.gereInfra(o.item_id) },

    const troca = o && (n.pessoa_id !== o.pessoa_id || n.projeto_id !== o.projeto_id);   // trocar a pessoa/projeto de uma coordenação também é definir
    if ((!o && n.coordena) || (o && (!!n.coordena !== !!o.coordena || (o.coordena && troca)))) falha('Somente a Direção pode definir coordenadores de projeto.');
    if (((!o && n.vice_coordena) || (o && (!!n.vice_coordena !== !!o.vice_coordena || (o.vice_coordena && troca))))
        && !(Perm.coordenaTitular(n.projeto_id) && (!o || Perm.coordenaTitular(o.projeto_id)))) falha('Somente a Direção ou o coordenador do projeto podem definir a vice-coordenação.');
  }
  if (t === 'cronograma' && o && !Perm.dir() && ['mes_inicio_base', 'mes_fim_base'].some(k => (o.mes_inicio_base != null || o.mes_fim_base != null) && (n[k] ?? null) !== (o[k] ?? null)))

  if (t === 'cronograma' && o && !Perm.gereProjeto(o.projeto_id)) {
    for (const k of ['codigo', 'titulo', 'responsavel_id', 'projeto_id', 'entrega', 'descricao', ...(Perm.tem('cronograma_gerir') ? [] : ['mes_inicio', 'mes_fim'])])
      if (JSON.stringify(n[k] ?? null) !== JSON.stringify(o[k] ?? null)) falha(Perm.tem('cronograma_gerir') ? 'A gerência reprograma prazos e atualiza o andamento; a estrutura do cronograma (código, título, responsável, entregas) é da coordenação.' : 'O responsável pela atividade só atualiza andamento, conclusão, evidência e observações. O planejamento é da coordenação.');
  }
  if (t === 'pendencias' && o && !Perm.gereProjeto(o.projeto_id)) {

      if (JSON.stringify(n[k] ?? null) !== JSON.stringify(o[k] ?? null)) falha('O responsável pela pendência só atualiza situação, resolução e documento. Prazo e responsável são definidos pela coordenação.');
  }

      if (JSON.stringify(n[k] ?? null) !== JSON.stringify(o[k] ?? null)) falha('O responsável pela entrega só atualiza situação, data de entrega, documento e observações. Prazo e responsável são definidos pela coordenação.');
  }
  if (t === 'pessoas' && o && !(Perm.dir() || Perm.tem('pessoas_gerir'))) {
    if (norm(n.email) !== norm(o.email)) falha('O e-mail do cadastro só pode ser alterado pela Direção ou pela gerência que gere pessoas (ele liga o cadastro ao login).');
  }
  if (t === 'pessoas' && o && !Perm.gerePessoa(o.id)) {

  }

/* traduz erros do Postgres/Supabase para português */
function traduzErro(e) {

  const m = (e && (e.message || e.details)) || String(e);
  const code = e && e.code;
  if (code === '23P01' || /exclusion constraint/i.test(m)) return 'Conflito de horário com outra reserva confirmada.';
  if (code === '23505' || /duplicate key/i.test(m)) return 'Já existe um registro igual.';
  if (code === '23503' || /foreign key/i.test(m)) return 'Este registro está em uso por outros dados.';
  if (code === '23514' || /check constraint/i.test(m)) return 'Valor inválido (' + ((m.match(/"([^"]+)"$/) || [])[1] || 'regra de validação') + ').';
  if (/permission denied for (table|view|function|schema|sequence)/i.test(m)) return 'O banco recusou o acesso à tabela (faltam permissões da API). Confira se o gpmot_schema.sql v1.2 ou mais novo foi aplicado.';
  if (code === '42501' || /row-level security/i.test(m)) return 'Você não tem permissão para esta operação.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet.';
  if (/token has expired or is invalid|otp.*(expired|invalid)/i.test(m)) return 'Código inválido ou vencido. Peça um novo código.';
  if (/rate limit|too many requests/i.test(m) || (e && e.status === 429)) return 'Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente de novo.';
  const seg = m.match(/only request this after (\d+) seconds/i); if (seg) return `Por segurança, aguarde ${seg[1]} segundos antes de pedir outro código.`;
  if (/signups not allowed|signup.*disabled/i.test(m)) return 'Este e-mail não está cadastrado para acessar o sistema. Fale com a Direção.';
  const nn = m.match(/null value in column "([^"]+)" of relation "([^"]+)"/i); if (nn) return `Campo obrigatório vazio: ${nn[1]} (${nn[2]}). Preencha esse campo no registro e tente de novo.`;
  if (/error sending .*email/i.test(m)) return 'A Supabase não conseguiu enviar o e-mail com o código. Confira o envio de e-mails do projeto (SMTP) no painel da Supabase — guia de implantação, passo 4.';
  if (/invalid path specified in request url/i.test(m)) return 'Endereço do projeto incorreto. Use só https://xxxx.supabase.co (sem /rest/v1 no fim), em Configurações.';
  if (/invalid api key|no api key/i.test(m)) return 'Chave do projeto inválida. Confira a chave pública nas Configurações.';
  if (/^relation "[^"]+" does not exist|could not find the table/i.test(m)) return 'O banco online não tem as tabelas do programa. Rode o arquivo gpmot_schema.sql no SQL Editor da Supabase.';
  const col = m.match(/column "([^"]+)" of relation "([^"]+)" does not exist|could not find the '([^']+)' column of '([^']+)'/i);
  if (col) return `O banco online está em outra versão do esquema (falta a coluna ${col[1] || col[3]} em ${col[2] || col[4]}). Aplique o gpmot_schema.sql mais recente.`;
  return m;
}

/* migração dos dados locais da v2.0 (orçamento em "linhas") para o orçamento por rubricas */
const MAPA_RUBRICA_ANTIGA = { bolsas: '1.1.1', consumo_nac: '1.3', consumo_imp: '1.3', permanente_nac: '2.1', permanente_imp: '2.1', servico_pf: '1.4', servico_pj: '1.4', obras: '2.2', viagens: '1.2.1', diarias: '1.2.2', contrapartidas: '1.5', desembolso: '1.5' };
function migrarFinanceiroLocal() {
  let antigas = null; try { antigas = JSON.parse(localStorage.getItem(LS_PREFIX + 'orcamento_linhas') || 'null'); } catch { }
  let mudou = false;
  if (!D.rubricas.some(r => r.codigo === '1.1.1')) { D.rubricas = rubricasPadrao(); mudou = true; }
  { const pad = rubricasPadrao(), falta = pad.filter(r => !D.rubricas.some(x => x.codigo === r.codigo));   // rubricas novas do plano padrão (ex.: 1.6 na v2.29)
    if (falta.length) { D.rubricas.push(...falta); pad.forEach(r => { const x = D.rubricas.find(y => y.codigo === r.codigo); x.ordem = r.ordem; }); mudou = true; } }
  D.projetos.forEach(p => { if (!p.tipo) { p.tipo = 'edital'; mudou = true; } });
  D.vinculos_financeiros.forEach(v => { if (!v.rubrica) { v.rubrica = v.tipo === 'tecnico' ? '1.1.2' : '1.1.1'; delete v.linha_aprovada_id; mudou = true; } });

      const rub = MAPA_RUBRICA_ANTIGA[l.rubrica] || '1.5';
      if (l.estagio === 'executado') {
        if (num(l.valor) > 0) D.despesas.push({ id: newId(), projeto_id: l.projeto_id, rubrica: rub, data: isDate(l.data_ref) ? l.data_ref : hoje(), descricao: l.item || 'Despesa migrada', documento: l.documento || null, valor: num(l.valor), vinculo_id: l.vinculo_id || null, obs: l.obs || null, criado_em: agora, atualizado_em: agora });
        return;
      }
      let o = D.orcamento_rubricas.find(x => x.projeto_id === l.projeto_id && x.rubrica === rub);
      if (!o) { o = { id: newId(), projeto_id: l.projeto_id, rubrica: rub, aprovado: 0, previsto: 0, criado_em: agora, atualizado_em: agora }; D.orcamento_rubricas.push(o); }

/* ── armazenamento online (Supabase) ────────────────────────────── */
/* só o endereço do projeto (https://xxxx.supabase.co): o painel mostra a URL da API com /rest/v1/ no fim,
   e com esse caminho o login falha com "Invalid path specified in request URL" */
function urlProjeto(u) { u = String(u || '').trim(); try { const x = new URL(u); return x.origin; } catch { return u.replace(/\/+$/, ''); } }
const SB = {
  client: null,
  cfg() {
    let c = { ...SUPABASE_CONFIG };
    try { const o = JSON.parse(localStorage.getItem(LS_PREFIX + '_supabase') || 'null'); if (o && o.url && o.anonKey) c = o; } catch { }
    if (c.url) c = { ...c, url: urlProjeto(c.url) };
    return c.url && c.anonKey ? c : null;
  },
  async connect() {
    const c = this.cfg(); if (!c) return false;
    // biblioteca embutida no próprio arquivo (versão fixa; nada é baixado de terceiros)
    const mod = window.supabase; if (!mod || !mod.createClient) throw new Error('Biblioteca do Supabase ausente neste arquivo. Monte o programa com build.cjs.');
    this.client = mod.createClient(c.url, c.anonKey);
    return true;
  },
  /* leitura pelas visões do banco: dados pessoais de terceiros (Leitura) e valores de projetos e
     aditivos (quem não tem cargo) chegam vazios; as colunas de valor não se leem nas tabelas */
  VISAO: { pessoas: 'v_pessoas', projetos: 'v_projetos_tela', aditivos: 'v_aditivos_tela' },
  PROTEGIDAS: { projetos: ['valor_total', 'contrapartida'], aditivos: ['valor_anterior', 'novo_valor'] },
  fonte: {},
  /* colunas devolvidas após gravar (sem as colunas de valor, que o banco não deixa ler direto) */
  retorno(t) { const p = this.PROTEGIDAS[t]; return p ? [...COLUNAS[t]].filter(c => !p.includes(c)).join(',') : '*'; },
  async fetchAll(t) {
    const out = []; let from = 0;
    const src = this.fonte[t] || this.VISAO[t] || t;
    for (; ;) {
      const { data, error } = await this.client.from(src).select('*').range(from, from + 999);
      if (error && src !== t && /does not exist|could not find|PGRST205|42P01/i.test((error.message || '') + (error.code || ''))) { this.fonte[t] = t; return this.fetchAll(t); }   // banco em versão anterior (sem a visão)
      if (error) throw error;
      out.push(...data); if (data.length < 1000) break; from += 1000;
    }
    return out;
  },
  async loadAll() {
    const ts = Object.keys(TABLES).filter(t => t !== 'historico');
    const res = await Promise.all(ts.map(t => this.fetchAll(t)));
    ts.forEach((t, i) => D[t] = res[i]);
  },
  async reload(tables) { for (const t of tables) D[t] = await this.fetchAll(t); },
  clean(t, row) { const r = soColunas(t, row); delete r.criado_em; delete r.atualizado_em; delete r.atualizado_por; return r; },
  async insert(t, row) {
    const r = this.clean(t, row);
    const { data, error } = await this.client.from(t).insert(r).select(this.retorno(t));
    if (error) throw error; return { ...r, ...data[0] };
  },
  async update(t, id, patch, prev) {
    const k = keyOf(t);
    let q = this.client.from(t).update(this.clean(t, patch)).eq(k, id);
    if (prev && prev.atualizado_em && !TABLES[t].noStamp) q = q.eq('atualizado_em', prev.atualizado_em);
    const { data, error } = await q.select(this.retorno(t));
    if (error) throw error;
    if (data.length && this.PROTEGIDAS[t]) { const p = this.clean(t, patch); this.PROTEGIDAS[t].forEach(c => { data[0][c] = c in p ? p[c] : prev ? prev[c] : null; }); }
    if (!data.length) throw new ErroRegra('Este registro foi alterado por outra pessoa enquanto você editava (ou você não tem permissão). Recarregue os dados e tente de novo.');
    return data[0];
  },
  async remove(t, match) {
    let q = this.client.from(t).delete(); Object.entries(match).forEach(([k, v]) => q = q.eq(k, v));
    const { data, error } = await q.select(this.retorno(t)); if (error) throw error;
    if (!data.length) throw new ErroRegra('Você não tem permissão para excluir este registro.');
  },
};

  /* saúde do projeto: indicadores e sinal (bad/warn/ok) com os motivos */
  saudeProjeto(p) {

    const ini = toDate(p.inicio), fim = toDate(p.fim), dur = Math.max(1, fim - ini);
    const tempoPct = Math.max(0, Math.min(100, Math.round((toDate(t) - ini) / dur * 100)));
    const mesesRest = Math.max(0, Math.round((fim - toDate(t)) / (864e5 * 30.44)));

    const veF = Perm.veFin(p.id); let fin = null, caixa = null, parcAtr = 0;
    if (veF) { const o = Calc.totaisOrc(p.id); if (o.aprovado) fin = { exec: o.executado, apr: o.aprovado, pct: Math.round(o.executado / o.aprovado * 100) };
      if (D.desembolsos.some(d => d.projeto_id === p.id)) { const ds = Calc.desembolso(p).tot; caixa = ds.caixa; parcAtr = ds.atrasadas.length; } }
    const ents = Calc.entregasAbertas(p.id), entAtr = ents.filter(Calc.entregaAtrasada).length, entProx = ents.filter(e => e.prazo >= t && e.prazo <= addDays(t, 30)).length;

    const eq = Calc.equipePlano(p).tot;
    if (Calc.vencido(p)) mot.bad.push('vigência vencida');
    if (p.status === 'critico') mot.bad.push('marcado como crítico');
    if (entAtr) mot.bad.push(`${entAtr} entrega(s) atrasada(s)`);
    if (pendAtr) mot.bad.push(`${pendAtr} pendência(s) atrasada(s)`);
    if (caixa != null && caixa < -0.005) mot.bad.push('gastos acima do recebido');
    if (parcAtr) mot.bad.push(`${parcAtr} parcela(s) não recebida(s)`);
    if (fis && fis.prev - fis.pct > 15) mot.bad.push(`físico ${fis.prev - fis.pct} p.p. abaixo do previsto`);
    else if (fis && fis.prev - fis.pct > 5) mot.warn.push(`físico ${fis.prev - fis.pct} p.p. abaixo do previsto`);
    if (fin && tempoPct >= 25 && tempoPct - fin.pct > 25) mot.warn.push(`execução financeira baixa (${fin.pct}% em ${tempoPct}% do prazo)`);
    if (!Calc.vencido(p) && mesesRest <= 6 && ((fis && fis.pct < 80) || (fin && fin.pct < 70))) mot.warn.push(`faltam ${mesesRest} mês(es) de vigência`);

  /* árvore do orçamento: linhas na ordem do plano, com grupos somando as folhas */
  orcamento(p) {

      const fs = plano.filter(x => x.pai === r.codigo);
      if (!fs.length) { const v = Calc.valoresRubrica(p.id, r.codigo); rows.push({ r, nivel, folha: true, ...v }); return v; }
      const i = rows.length; rows.push(null);
      const acc = { aprovado: 0, previsto: 0, executado: 0, n: 0 };
      fs.forEach(f => { const v = walk(f, nivel + 1); acc.aprovado += v.aprovado; acc.previsto += v.previsto; acc.executado += v.executado; acc.n += v.n; });
      rows[i] = { r, nivel, folha: false, ...acc }; return acc;
    };
    const tot = { aprovado: 0, previsto: 0, executado: 0, n: 0 };
    plano.filter(r => !r.pai || !plano.some(x => x.codigo === r.pai)).forEach(r => { const v = walk(r, 0); tot.aprovado += v.aprovado; tot.previsto += v.previsto; tot.executado += v.executado; tot.n += v.n; });

/* ── modal / formulários ────────────────────────────────────────── */
let MODAL = null;
function openModal(html, opts = {}) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="ov"><div class="modal${opts.wide ? ' wide' : ''}">${html}</div></div>`;
  MODAL = { opts, root };
  root.querySelector('.ov').addEventListener('mousedown', e => { if (e.target.classList.contains('ov') && !opts.sticky) closeModal(); });
  const first = root.querySelector('input:not([type=checkbox]):not([readonly]),select,textarea'); if (first && !opts.noFocus) first.focus();
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; MODAL = null; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && MODAL) closeModal(); });

function fieldHTML(f, v) {
  const id = 'fld_' + f.k, ro = f.ro ? ' disabled' : '';
  const lab = `<label class="fl" for="${id}">${esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}</label>`;
  const help = f.help ? `<div class="help">${esc(f.help)}</div>` : '';
  let inp = '';
  switch (f.t) {
    case 'textarea': inp = `<textarea id="${id}" rows="${f.rows || 3}"${ro}>${esc(v ?? '')}</textarea>`; break;
    case 'select': inp = `<select id="${id}"${ro}>${(f.blank !== false ? `<option value="">${esc(f.blank || '—')}</option>` : '')}${f.opts.map(([ov, ol]) => `<option value="${esc(ov)}"${String(ov) === String(v ?? '') ? ' selected' : ''}>${esc(ol)}</option>`).join('')}</select>`; break;
    case 'sec': return f.l ? `<div class="full fsec">${esc(f.l)}</div>` : '';
    case 'check': return `<div class="${f.full ? 'full' : ''}"><label class="row small" style="margin-top:18px"><input type="checkbox" id="${id}"${v ? ' checked' : ''}${ro}> ${esc(f.l)}</label>${help}</div>`;
    case 'multi': inp = `<div class="checks" id="${id}">${f.opts.map(([ov, ol]) => `<label><input type="checkbox" value="${esc(ov)}"${(v || []).includes(ov) ? ' checked' : ''}${ro}> ${esc(ol)}</label>`).join('')}</div>`; break;
    case 'tags': inp = `<textarea id="${id}" rows="${f.rows || 2}"${ro}>${esc((v || []).join(', '))}</textarea>`; break;
    case 'money': case 'number': inp = `<input id="${id}" type="number" step="${f.step || (f.t === 'money' ? '0.01' : 'any')}"${f.min != null ? ` min="${f.min}"` : ''}${f.max != null ? ` max="${f.max}"` : ''} value="${v ?? ''}"${ro}>`; break;
    case 'date': inp = `<input id="${id}" type="date" value="${esc(v || '')}"${ro}>`; break;
    case 'datetime': inp = `<input id="${id}" type="datetime-local" value="${esc(v ? toLocalDT(v) : '')}"${ro}>`; break;
    default: inp = `<input id="${id}" type="text" value="${esc(v ?? '')}"${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}${ro}>`;
  }
  return `<div class="${f.full || ['textarea', 'multi', 'tags'].includes(f.t) ? 'full' : ''}">${lab}${inp}${help}</div>`;
}
function toLocalDT(iso) { const d = new Date(iso); if (isNaN(d)) return ''; return isoOf(d) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function readField(f) {
  const el = document.getElementById('fld_' + f.k); if (!el) return undefined;
  switch (f.t) {
    case 'sec': return f.l ? `<div class="full fsec">${esc(f.l)}</div>` : '';
    case 'check': return el.checked;
    case 'multi': return [...el.querySelectorAll('input:checked')].map(x => x.value);
    case 'tags': return el.value.split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
    case 'money': case 'number': return el.value === '' ? null : Number(el.value);
    case 'datetime': return el.value ? new Date(el.value).toISOString() : null;
    case 'select': return el.value === '' ? null : el.value;
    default: { const s = el.value.trim(); return s === '' ? null : s; }
  }
}
/* form({title, fields, values, onSave(vals), onDelete, intro, wide}) */
function form(o) {
  const vals = o.values || {};
  const html = `<h3>${esc(o.title)}</h3>${o.intro || ''}
    <div class="fgrid">${o.fields.filter(f => !f.hide).map(f => fieldHTML(f, vals[f.k])).join('')}</div>
    ${o.after || ''}
    <div class="merr" id="m_err" style="display:none"></div>
    <div class="mactions">
      ${o.onDelete ? `<button class="btn-d left" id="m_del">${esc(o.deleteLabel || 'Excluir')}</button>` : ''}
      <button id="m_cancel">Cancelar</button>
      ${o.onSave ? `<button class="btn-p" id="m_ok">${esc(o.okLabel || 'Salvar')}</button>` : ''}
    </div>`;
  openModal(html, { wide: o.wide, sticky: true });
  const err = m => { const e = document.getElementById('m_err'); e.textContent = m; e.style.display = 'block'; };
  document.getElementById('m_cancel').onclick = closeModal;
  if (o.onSave) document.getElementById('m_ok').onclick = async () => {
    const out = {};
    for (const f of o.fields.filter(f => !f.hide && !f.ro && f.t !== 'sec')) {
      const v = readField(f); out[f.k] = v;
      if (f.req && (v == null || v === '' || (Array.isArray(v) && !v.length))) { err(`Preencha: ${f.l}.`); return; }
    }
    const btn = document.getElementById('m_ok'); btn.disabled = true;
    try { await o.onSave(out); closeModal(); render(); if (o.okMsg !== false) flash(o.okMsg || '✓ Salvo'); }
    catch (e) { console.error(e); err(traduzErro(e)); btn.disabled = false; }
  };
  if (o.onDelete) document.getElementById('m_del').onclick = async () => {
    if (!await confirmar(o.deleteConfirm || 'Confirma a exclusão?')) return;
    try { await o.onDelete(); closeModal(); render(); flash('Excluído'); }
    catch (e) { console.error(e); err(traduzErro(e)); }
  };
  if (o.onOpen) o.onOpen();
}
function confirmar(msg) {
  return new Promise(res => {
    const prev = document.getElementById('modal-root').innerHTML;
    const box = document.createElement('div');
    box.innerHTML = `<div class="ov" style="z-index:70"><div class="modal" style="max-width:440px"><h3>Confirmação</h3><p style="font-size:13px;white-space:pre-line">${esc(msg)}</p>
      <div class="mactions"><button id="c_no">Cancelar</button><button class="btn-d" id="c_yes">Confirmar</button></div></div></div>`;
    document.body.appendChild(box);
    box.querySelector('#c_no').onclick = () => { box.remove(); res(false); };
    box.querySelector('#c_yes').onclick = () => { box.remove(); res(true); };
  });
}
function mostrar(title, html, wide) {
  openModal(`<div class="between mb"><h3 style="margin:0">${esc(title)}</h3><button class="btn-s" id="m_x">✕</button></div>${html}`, { wide, noFocus: true });

}

function tarefaLinha(t, o = {}) {

  return `<div class="task${t.concluida ? ' done' : ''}">

function listaTarefas(list, o = {}) {

A.tarefaToggle = async d => { const t = byId('tarefas', d.id); await Data.update('tarefas', t.id, { concluida: !t.concluida }); render(); };

function formTarefa(t, pre = {}) {
  const novo = !t;
  const v = t ? { ...t, responsaveis: D.tarefa_responsaveis.filter(r => r.tarefa_id === t.id).map(r => r.pessoa_id) } : { prioridade: 'normal', ...pre };

  form({

      { k: 'inicio', l: 'Início', t: 'date' }, { k: 'prazo', l: 'Prazo', t: 'date' },
      { k: 'prioridade', l: 'Prioridade', t: 'select', opts: PRIORIDADES, blank: false },
      { k: 'concluida', l: 'Concluída', t: 'check' },

      let row;
      if (novo) row = await Data.insert('tarefas', x); else row = await Data.update('tarefas', t.id, x);
      if (resp && gereResp) {
        const atuais = D.tarefa_responsaveis.filter(r => r.tarefa_id === row.id).map(r => r.pessoa_id);
        for (const pid of atuais.filter(p => !resp.includes(p))) await Data.removeWhere('tarefa_responsaveis', { tarefa_id: row.id, pessoa_id: pid });
        for (const pid of resp.filter(p => !atuais.includes(p))) await Data.insert('tarefa_responsaveis', { tarefa_id: row.id, pessoa_id: pid });
      }

function ganttTarefas(list, grupo = t => t.projeto_id ? siglaProjeto(t.projeto_id) : ((byId('gerencias', t.gerencia_id) || {}).nome || '')) {
  const rows = list.filter(t => t.inicio || t.prazo).map(t => {
    const s = toDate(t.inicio || t.prazo), e = toDate(t.prazo || t.inicio);
    return { t, s, e, ms: !(t.inicio && t.prazo) };
  }).sort((a, b) => a.s - b.s);
  if (!rows.length) return `<div class="empty">Sem tarefas com datas para o gráfico. Defina início e/ou prazo.</div>`;
  const today = toDate(hoje()); let min = rows[0].s, max = rows[0].e;
  rows.forEach(r => { if (r.s < min) min = r.s; if (r.e > max) max = r.e; });
  if (today < min) min = today; if (today > max) max = today;
  const DAY = 864e5; min = new Date(+min - 3 * DAY); max = new Date(+max + 3 * DAY);
  const days = Math.max(1, Math.round((max - min) / DAY));
  const LW = 230, rowH = 22, headH = 20, per = Math.max(2, Math.min(16, 760 / days)), W = LW + Math.round(days * per) + 10, H = headH + rows.length * rowH + 14;
  const x = d => LW + ((d - min) / DAY) * per;
  const o = [`<svg viewBox="0 0 ${W} ${H}" style="width:${W}px;max-width:100%;height:auto;font-family:'Segoe UI',sans-serif">`];
  let cur = new Date(min.getFullYear(), min.getMonth(), 1);
  while (cur <= max) { const cx = x(cur); if (cx >= LW) { o.push(`<line x1="${cx}" y1="${headH - 4}" x2="${cx}" y2="${H}" stroke="#eee"/><text x="${cx + 3}" y="13" fill="#9b9b98" font-size="9.5">${MESES[cur.getMonth()]}/${String(cur.getFullYear()).slice(2)}</text>`); } cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); }
  const tx = x(today); o.push(`<line x1="${tx}" y1="${headH - 4}" x2="${tx}" y2="${H}" stroke="#c43030" stroke-dasharray="3 3"/><text x="${tx + 2}" y="${H - 2}" fill="#c43030" font-size="9">hoje</text>`);
  rows.forEach((r, i) => {
    const y = headH + i * rowH + 3, bx = x(r.s), bw = Math.max(r.ms ? 9 : 5, x(r.e) - bx + per);
    const late = !r.t.concluida && r.e < today;
    const fill = r.t.concluida ? '#cfd3c9' : late ? '#e07a6a' : '#5b8fce';
    const label = (grupo(r.t) ? grupo(r.t) + ' · ' : '') + (r.t.titulo || '');
    o.push(`<text x="4" y="${y + 11}" fill="#444" font-size="10.5">${esc(label.length > 38 ? label.slice(0, 37) + '…' : label)}</text>`);
    if (r.ms) { const cx = bx + 4; o.push(`<rect x="${cx - 5}" y="${y}" width="10" height="10" transform="rotate(45 ${cx} ${y + 5})" fill="${fill}"/>`); }
    else o.push(`<rect x="${bx}" y="${y - 1}" width="${bw}" height="14" rx="3" fill="${fill}"><title>${esc(r.t.titulo)}</title></rect>`);
  });
  o.push('</svg>');
  return `<div class="card" style="padding:8px;overflow-x:auto">${o.join('')}</div>`;
}

/* alertas do laboratório (cada um com o projeto a que se refere, para agrupar) */
function alertasPainel() {
  const t = hoje(), al = [], push = (c, h, pid) => al.push({ c, h, pid: pid || null });
  const btn = (a, attrs) => ` <button class="btn-s" data-a="${a}" ${attrs || ''}>abrir</button>`;
  D.projetos.filter(p => Calc.vencido(p)).forEach(p => push('warn', `Vigência terminou em ${fmtD(p.fim)} e o projeto continua marcado como vigente.${btn('projAbrir', `data-id="${p.id}"`)}`, p.id));
  D.projetos.filter(p => Calc.vigente(p) && p.status === 'critico').forEach(p => push('bad', `Marcado como crítico${p.notas ? ': ' + esc(p.notas) : ''}`, p.id));
  D.desembolsos.filter(d => Perm.veFin(d.projeto_id) && Calc.situacaoParcela(d) === 'atrasada').sort(byName('data_prevista')).forEach(d => push('bad', `Parcela ${d.numero} do desembolso (${fmtBRL(d.valor_previsto)}) prevista para ${fmtD(d.data_prevista)} não recebida${btn('finDesemb', `data-id="${d.projeto_id}"`)}`, d.projeto_id));
  D.projetos.filter(p => Perm.veFin(p.id) && D.desembolsos.some(d => d.projeto_id === p.id)).forEach(p => { const x = Calc.desembolso(p).tot; if (x.caixa < -0.005) push('bad', `Gastos acima do recebido — caixa ${fmtBRL2(x.caixa)}${btn('finDesemb', `data-id="${p.id}"`)}`, p.id); });
  D.vinculos_financeiros.filter(v => Perm.veFin(v.projeto_id) && ['previsto', 'ativo'].includes(v.status) && v.fim && v.fim >= t && v.fim <= addDays(t, 30)).sort(byName('fim')).forEach(v => push('warn', `Bolsa de <b>${esc(nomePessoa(v.pessoa_id))}</b> termina em ${fmtD(v.fim)}${btn('eqBolsas')}`, v.projeto_id));
  D.equipe_plano.filter(e => e.status === 'selecao' && e.selecao_prazo && e.selecao_prazo < t && Perm.gereAlocacao(e.projeto_id)).forEach(e => push('warn', `Seleção para “${esc(e.nome_plano)}” passou do prazo (${fmtD(e.selecao_prazo)})${btn('eqVagas')}`, e.projeto_id));
  Calc.emTransicao().filter(x => Perm.gerePessoa(x.pe.id) && x.falta && (x.fase === 'saida' ? x.pe.saida < t : x.pe.ingresso && x.pe.ingresso < addDays(t, -30))).forEach(x => push('warn', `<b>${esc(x.pe.nome)}</b>: ${x.falta} item(ns) de ${x.fase === 'entrada' ? 'integração' : 'desligamento'} pendente(s)${btn('pessoaAbrir', `data-id="${x.pe.id}"`)}`));
  D.pendencias.filter(Calc.pendenciaAtrasada).sort(byName('prazo')).forEach(x => push('bad', `Pendência “${esc(x.titulo)}” venceu em ${fmtD(x.prazo)}${x.responsavel_id ? ' · ' + esc(nomePessoa(x.responsavel_id)) : ''}${btn('projAbrir', `data-id="${x.projeto_id}" data-aba="docs"`)}`, x.projeto_id));
  D.entregas.filter(Calc.entregaAtrasada).sort(byName('prazo')).forEach(e => push('bad', `Entrega “${esc(e.titulo)}” venceu em ${fmtD(e.prazo)}${e.responsavel_id ? ' · ' + esc(nomePessoa(e.responsavel_id)) : ''}${btn('projAbrir', `data-id="${e.projeto_id}" data-aba="entregas"`)}`, e.projeto_id));
  D.entregas.filter(e => Calc.entregaAberta(e) && e.prazo >= t && e.prazo <= addDays(t, 15)).sort(byName('prazo')).forEach(e => push('warn', `Entrega “${esc(e.titulo)}” vence em ${fmtD(e.prazo)}${e.responsavel_id ? ' · ' + esc(nomePessoa(e.responsavel_id)) : ''}`, e.projeto_id));
  D.pessoas.filter(p => p.ativo !== false && Calc.carga(p.id) > 100).forEach(p => push('warn', `<b>${esc(p.nome)}</b> com carga de ${Math.round(Calc.carga(p.id))}% nos projetos vigentes`));

  Calc.alertasInfra().forEach(a => push(a.grave ? 'bad' : 'warn', esc(a.txt)));

/* ── Minha semana ── */

  const cont = grupos.map(([, f]) => ag.filter(f).length);

  const meusProj = D.alocacoes.filter(a => a.pessoa_id === ME.pessoa_id && a.status === 'ativo').map(a => ({ a, p: byId('projetos', a.projeto_id) })).filter(x => x.p && Calc.vigente(x.p)).sort((a, b) => (b.a.coordena || b.a.vice_coordena) - (a.a.coordena || a.a.vice_coordena) || String(a.p.sigla).localeCompare(b.p.sigla));
  const coordIds = new Set(meusProj.filter(x => x.a.coordena || x.a.vice_coordena).map(x => x.p.id));

  const linha = x => { const atr = x.data && x.data < t;
    return `<div class="row small click" style="gap:10px;padding:6px 0;border-bottom:1px solid #eeebe4" ${attrsEv(x.a)}><span style="width:78px;font-variant-numeric:tabular-nums;${atr ? 'color:var(--red);font-weight:600' : ''}">${x.data ? (x.data.slice(0, 4) === t.slice(0, 4) ? fmtD(x.data).slice(0, 5) : fmtD(x.data).slice(0, 6) + x.data.slice(2, 4)) + ' ' + ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][toDate(x.data).getDay()] : '—'}</span>
      <span class="b b-gray" style="min-width:74px;text-align:center">${esc(x.tipo)}</span>${x.pid ? `<span class="muted" style="min-width:90px">${esc(siglaProjeto(x.pid))}</span>` : '<span style="min-width:90px"></span>'}<span style="flex:1">${esc(x.txt)}</span></div>`; };
  const mets = [['Atrasados', cont[0], cont[0] ? 'color:var(--red)' : ''], ['Esta semana', cont[1]], ['Próximos 30 dias', cont[2]], ['Meus projetos vigentes', meusProj.length]];
  return `<div class="between mb"><div><div class="title" style="font-size:18px">Olá, ${esc((pe && pe.nome || '').split(' ')[0])}</div><div class="small muted">${['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'][dow]}, ${fmtD(t)} · o que está sob a sua responsabilidade</div></div>
    ${Perm.podeEditar() ? `<button class="btn-s" data-a="tarefaNova">+ tarefa</button>` : ""}</div>
  <div class="metrics">${mets.map(([k, v, s]) => `<div class="metric"><div class="k">${k}</div><div class="v" style="${s || ''}">${v}</div></div>`).join('')}</div>
  <div class="grid" style="grid-template-columns:minmax(420px,3fr) minmax(300px,2fr);align-items:start">
    <div class="card">${ag.length ? grupos.map(([nome, f, c], i) => { const l = ag.filter(f).sort((a, b) => String(a.data || '').localeCompare(String(b.data || ''))); return l.length ? `<div class="sec" style="${i === 0 ? 'margin-top:0;' : ''}${c ? 'color:var(--red)' : ''}">${nome} (${l.length})</div>${l.map(linha).join('')}` : ''; }).join('')

    <div>
      ${atencao.length ? `<div class="card mb"><div class="bold mb">Precisa da sua atenção <span class="small muted">(projetos que você coordena)</span></div>${atencao.map(x => `<div class="alert ${x.c}"><b>${esc(siglaProjeto(x.pid))}</b>: ${x.h}</div>`).join('')}</div>` : ''}
      <div class="card mb"><div class="bold mb">Meus projetos</div>${meusProj.length ? meusProj.map(({ a, p }) => { const s = Calc.saudeProjeto(p), prox = Calc.entregasAbertas(p.id)[0];
        return `<div class="click" data-a="projAbrir" data-id="${p.id}" style="padding:7px 0;border-bottom:1px solid #eeebe4"><div class="between"><span><b>${esc(p.sigla)}</b> ${a.coordena ? badge('coordena', 'b-green') : a.vice_coordena ? badge('vice-coordena', 'b-green') : `<span class="small muted">${esc(a.papel || '')}</span>`}</span>${badge(SINAL[s.sinal][2] + ' ' + SINAL[s.sinal][0], SINAL[s.sinal][1])}</div>

    </div></div>`;

    const finCel = !x.veF ? '<span class="faint">—</span>' : x.fin ? `${barraExec(x.fin.exec, x.fin.apr)}<div class="small muted">em ${x.tempoPct}% do prazo</div>` : '<span class="small faint">sem orçamento</span>';
    return `<tr class="click" data-a="projAbrir" data-id="${p.id}"><td><b>${esc(p.sigla)}</b> ${badgeTipo(p)}<div class="small muted">${esc(coord || '—')}</div></td>
      <td class="small">${fmtD(p.fim)}<div class="muted">${Calc.vencido(p) ? '<b style="color:var(--red)">vencida</b>' : `${x.mesesRest} mês(es)`}</div></td>

      <td class="small">${x.entAtr ? `<b style="color:var(--red)">${x.entAtr} atrasada(s)</b><br>` : ''}${x.entProx ? `${x.entProx} em 30 dias` : x.entAtr ? '' : '<span class="faint">—</span>'}${x.pendAb ? `<div class="muted">${x.pendAb} pendência(s)${x.pendAtr ? ` · <b style="color:var(--red)">${x.pendAtr} atrasada(s)</b>` : ''}</div>` : ''}</td>
      <td class="small">${x.eq.posicoes ? `${x.eq.ocupadas}/${x.eq.posicoes}${x.eq.vagas ? ` · <span style="color:var(--yellow-txt)">${x.eq.vagas} vaga(s)</span>` : ''}` : `${D.alocacoes.filter(a => a.projeto_id === p.id && a.status === 'ativo').length} pessoa(s)`}</td>
      <td>${badge(sg[2] + ' ' + sg[0], sg[1])}${[...x.mot.bad, ...x.mot.warn].length ? `<div class="small muted" style="max-width:220px">${esc([...x.mot.bad, ...x.mot.warn].slice(0, 3).join(' · '))}</div>` : ''}</td></tr>`; }).join('');
  // alertas agrupados por projeto

  const ordemAl = Object.keys(porProj).sort((a, b) => (a ? 0 : 1) - (b ? 0 : 1) || porProj[b].filter(x => x.c === 'bad').length - porProj[a].filter(x => x.c === 'bad').length || String(siglaProjeto(a)).localeCompare(siglaProjeto(b)));

/* linha do tempo dos próximos N dias: uma faixa por categoria, marcas clicáveis, lista por semana abaixo */
function linhaTempo() {
  const n = +(UI.f.ltDias || 60), t = hoje(), ate = addDays(t, n), ev = Calc.eventos(t, ate, false);
  const W = 1060, L = 170, R = 14, H0 = 38, RH = 30, H = H0 + CAT_EV.length * RH + 8, x = d => L + (toDate(d) - toDate(t)) / (toDate(ate) - toDate(t)) * (W - L - R);
  const ticks = []; for (let d = t; d <= ate; d = addDays(d, 7)) ticks.push(d);
  const meses = []; { const a = toDate(t); for (let m = new Date(a.getFullYear(), a.getMonth() + 1, 1); isoOf(m) <= ate; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) meses.push(isoOf(m)); }
  // empilha marcas do mesmo dia na mesma faixa
  const pos = {}; const marks = ev.map(e => { const k = e.cat + '|' + e.data; pos[k] = (pos[k] || 0) + 1; return { e, dx: (pos[k] - 1) * 7 }; });
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block" role="img" aria-label="Linha do tempo dos próximos ${n} dias">
    ${meses.map(m => `<line x1="${x(m)}" x2="${x(m)}" y1="${H0 - 6}" y2="${H - 6}" stroke="#d0cec8" stroke-width="1"/><text x="${x(m) + 4}" y="12" font-size="11.5" font-weight="600" fill="#3d3d3a">${MESES[+m.slice(5, 7) - 1]}/${m.slice(2, 4)}</text>`).join('')}
    ${ticks.map(d => `<line x1="${x(d)}" x2="${x(d)}" y1="${H0 - 2}" y2="${H - 6}" stroke="#eeebe4" stroke-width="1"/><text x="${x(d)}" y="${H0 - 8}" font-size="10.5" fill="#5f5e5a" text-anchor="middle">${d.slice(8, 10)}/${d.slice(5, 7)}</text>`).join('')}
    ${CAT_EV.map(([nome], i) => `<text x="0" y="${H0 + i * RH + RH / 2 + 4}" font-size="12.5" fill="#3d3d3a">${esc(nome)}</text><line x1="${L}" x2="${W - R}" y1="${H0 + i * RH + RH / 2}" y2="${H0 + i * RH + RH / 2}" stroke="#eeebe4" stroke-width="1"/>`).join('')}
    <line x1="${L}" x2="${L}" y1="${H0 - 2}" y2="${H - 6}" stroke="#1c1c1a" stroke-width="1.5"/><text x="${L + 4}" y="${H - 1}" font-size="10.5" fill="#1c1c1a">hoje</text>
    ${marks.map(({ e, dx }) => `<g class="click" ${attrsEv(e.a)} style="cursor:pointer"><title>${esc(fmtD(e.data) + ' · ' + (e.pid ? siglaProjeto(e.pid) + ' · ' : '') + e.txt)}</title>
      <circle cx="${x(e.data) + dx}" cy="${H0 + e.cat * RH + RH / 2}" r="9" fill="transparent"/><circle cx="${x(e.data) + dx}" cy="${H0 + e.cat * RH + RH / 2}" r="5" fill="${CAT_EV[e.cat][1]}" stroke="#fff" stroke-width="2"/></g>`).join('')}
  </svg>`;
  // lista por semana
  const semanas = {}; ev.forEach(e => { const d = toDate(e.data), seg = addDays(e.data, -((d.getDay() + 6) % 7)); (semanas[seg] = semanas[seg] || []).push(e); });
  const lista = Object.keys(semanas).sort().map(s => `<div class="sec" style="margin-top:10px">Semana de ${fmtD(s < t ? t : s).slice(0, 5)}</div>${semanas[s].map(e => `<div class="row small click" ${attrsEv(e.a)} style="gap:8px;padding:3px 0"><span style="width:10px;height:10px;border-radius:50%;background:${CAT_EV[e.cat][1]};flex:none" title="${esc(CAT_EV[e.cat][0])}"></span><span style="width:40px;font-variant-numeric:tabular-nums">${fmtD(e.data).slice(0, 5)}</span>${e.pid ? `<span class="muted" style="min-width:86px">${esc(siglaProjeto(e.pid))}</span>` : '<span style="min-width:86px"></span>'}<span style="flex:1">${esc(e.txt)}</span></div>`).join('')}`).join('');
  const verLista = !!UI.f.ltLista;

async function salvarVaga(pid, e, x) {
  const b = { modalidade: x.b_modalidade, valor_mensal: x.b_valor, meses: x.b_meses, rubrica: x.b_rubrica };
  ['b_modalidade', 'b_valor', 'b_meses', 'b_rubrica', '_s'].forEach(k => delete x[k]);
  let v;
  if (Perm.gereAlocacao(pid)) {
    if (e && e.status === 'ocupada') delete x.status;
    v = e ? await Data.update('equipe_plano', e.id, x) : await Data.insert('equipe_plano', { ...x, projeto_id: pid, ordem: x.ordem ?? (Math.max(0, ...D.equipe_plano.filter(q => q.projeto_id === pid).map(q => num(q.ordem))) + 1) });
  } else v = e;
  if (Perm.editaFin(pid) && b.valor_mensal !== undefined) {
    const ex = D.equipe_plano_bolsas.find(q => q.vaga_id === v.id);
    const vazio = !b.modalidade && !num(b.valor_mensal);
    if (vazio) { if (ex) await Data.remove('equipe_plano_bolsas', ex.id); }
    else {
      if (!b.meses) falha('Informe a duração da bolsa em meses.');
      if (ex) await Data.update('equipe_plano_bolsas', ex.id, b); else await Data.insert('equipe_plano_bolsas', { ...b, vaga_id: v.id, projeto_id: pid });
    }
  }
  return v;
}

/* cria a bolsa (vínculo financeiro) de uma posição, respeitando os meses restantes e o fim do projeto */
/* valida antes de gravar qualquer coisa; devolve o período calculado */
function planoBolsaVaga(r, inicio, meses) {
  const p = byId('projetos', r.e.projeto_id);
  meses = Math.round(num(meses));
  if (!isDate(inicio)) falha('Informe o início da bolsa.');
  if (!(meses >= 1)) falha('Informe quantos meses de bolsa (1 ou mais).');
  if (meses > r.mesesRest) falha(`Esta posição tem só ${r.mesesRest} mês(es) de bolsa restantes no plano.`);
  if (p.inicio && inicio < p.inicio) falha(`A bolsa não pode começar antes do início da vigência (${fmtD(p.inicio)}).`);
  let fim = Calc.fimBolsa(inicio, meses), aviso = '';
  if (p.fim && fim > p.fim) { fim = p.fim; aviso = ` (limitada ao fim da vigência, ${fmtD(p.fim)})`; }
  if (fim < inicio) falha('O início da bolsa é posterior ao fim da vigência do projeto.');
  return { p, inicio, fim, aviso };
}
const inicioMes = iso => iso.slice(0, 8) + '01';
async function criarBolsaVaga(r, pessoa_id, inicio, meses, status) {
  const { p, fim, aviso } = planoBolsaVaga(r, inicio, meses);
  await Data.insert('vinculos_financeiros', { pessoa_id, projeto_id: p.id, vaga_id: r.e.id, tipo: r.bolsa.rubrica === '1.1.2' ? 'tecnico' : 'bolsa', modalidade: r.bolsa.modalidade || null,
    rubrica: r.bolsa.rubrica, valor_mensal: num(r.bolsa.valor_mensal), inicio, fim, status: status || 'previsto', obs: `Posição do plano: ${r.e.nome_plano}` });
  return `bolsa de ${fmtD(inicio)} a ${fmtD(fim)}${aviso}`;
}
const linhaVaga = id => { const e = byId('equipe_plano', id); return Calc.equipePlano(byId('projetos', e.projeto_id)).rows.find(q => q.e.id === id); };
const mesesAteFim = (p, ini) => p.fim && isDate(ini) ? Math.max(0, Calc.mesesPeriodo(ini, p.fim)) : 999;

        <td><b>${esc(c.nome)}</b>${c.email ? `<div class="muted">${esc(c.email)}</div>` : ''}</td><td>${esc(c.curso || '')}${urlSegura(c.lattes) ? ` · <a href="${esc(urlSegura(c.lattes))}" target="_blank" rel="noopener">Lattes ↗</a>` : ''}</td><td>${esc(c.origem || '')}</td>

    return `<tr${gere ? ` class="click" data-a="vagaEditar" data-id="${e.id}"` : ''}><td><button class="link" data-a="projAbrir" data-id="${e.projeto_id}" data-aba="equipe">${esc(siglaProjeto(e.projeto_id))}</button></td>
      <td><b>${esc(e.nome_plano)}</b><div class="small muted">${esc([e.funcao, lbl(CAT_PLANO, e.categoria)].filter(Boolean).join(' · '))}</div>${e.requisitos ? `<div class="small">${esc(e.requisitos)}</div>` : ''}</td>

/* ── Equipe › Bolsas: vencendo, sem registro, bolsistas sem vínculo ── */
function equipeBolsas() {
  const dias = +(UI.f.bvDias || 60), lim = addDays(hoje(), dias);
  const vis = D.vinculos_financeiros.filter(v => Perm.veFin(v.projeto_id));
  const vencendo = vis.filter(v => ['previsto', 'ativo'].includes(v.status) && v.fim && v.fim >= hoje() && v.fim <= lim).sort(byName('fim'));
  const vencidas = vis.filter(v => ['previsto', 'ativo'].includes(v.status) && v.fim && v.fim < hoje()).sort(byName('fim'));
  const semReg = []; D.projetos.filter(p => Perm.veFin(p.id) && Calc.vigente(p)).forEach(p => Calc.equipePlano(p).rows.filter(r => r.e.status === 'ocupada' && r.bolsa && r.mesesRest > 0 && !r.vAtual).forEach(r => semReg.push({ p, r })));
  const bolsistas = D.pessoas.filter(pe => pe.ativo !== false && ['ic', 'mestrando', 'doutorando', 'pos_doc'].includes(pe.tipo)
    && D.alocacoes.some(a => a.pessoa_id === pe.id && a.status === 'ativo' && Calc.vigente(byId('projetos', a.projeto_id)) && Perm.veFin(a.projeto_id))
    && !D.vinculos_financeiros.some(v => v.pessoa_id === pe.id && ['previsto', 'ativo'].includes(v.status) && (!v.fim || v.fim >= hoje())));

  const card = x => { const pe = x.pe, pode = Perm.gerePessoa(pe.id), tot = x.c.length, ok = tot - x.c.filter(y => !y.reg).length;
    const dias = x.fase === 'entrada' && pe.ingresso ? Math.round((toDate(hoje()) - toDate(pe.ingresso)) / 864e5) : null;
    return `<div class="card"><div class="between mb"><div><button class="link bold" data-a="pessoaAbrir" data-id="${pe.id}">${esc(pe.nome)}</button><div class="small muted">${esc(lbl(TIPOS_PESSOA, pe.tipo))} · ${x.fase === 'entrada' ? `ingresso ${fmtD(pe.ingresso) || '—'}${dias != null ? ` (há ${dias} dias)` : ''}` : `saída ${fmtD(pe.saida)}`} · ${esc(D.alocacoes.filter(a => a.pessoa_id === pe.id && a.status === 'ativo').map(a => siglaProjeto(a.projeto_id)).join(', ') || 'sem projeto ativo')}</div></div>

/* ── extração de dados de texto (portado da versão anterior) ── */
function normalizeText(s) {
  return (s||'')
    .replace(/\r/g,'\n')
    .replace(/[\t ]+/g,' ')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}
function cleanExtracted(s) {
  return (s||'')
    .replace(/^[\s:;\-–—]+/,'')
    .replace(/[\s;]+$/,'')
    .replace(/^['"“”]+|['"“”]+$/g,'')
    .trim();
}
function parseMoney(txt) {
  const t = txt || '';
  const patterns = [
    /(?:valor\s+(?:total|global|do\s+contrato|estimado)|import[aâ]ncia|montante|or[cç]amento)[^\n\r]{0,80}?R\$\s*([0-9\.]+(?:,[0-9]{2})?)/i,
    /R\$\s*([0-9\.]+(?:,[0-9]{2})?)/i
  ];
  for(const re of patterns) {
    const m = t.match(re);
    if(m) return Number(m[1].replace(/\./g,'').replace(',','.')) || 0;
  }
  return 0;
}
function monthNum(m) {
  const mm = stripAccents((m||'').toLowerCase()).slice(0,3);
  return {jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12}[mm] || null;
}
function toYM(y,m) {
  if(!y||!m) return '';
  return String(y).padStart(4,'0')+'-'+String(m).padStart(2,'0');
}
function parseDateToYM(s) {
  if(!s) return '';
  let m;
  m = s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m) return toYM(Number(m[3].length===2?'20'+m[3]:m[3]), Number(m[2]));
  m = s.match(/(\d{4})[\/\-.](\d{1,2})/);
  if(m) return toYM(Number(m[1]), Number(m[2]));
  m = s.match(/(janeiro|fevereiro|mar[cç]o|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\s+(?:de\s+)?(\d{4})/i);
  if(m) return toYM(Number(m[2]), monthNum(m[1]));
  return '';
}
function addMonthsYM(ym, months) {
  if(!ym || !months) return '';
  const [y,m]=ym.split('-').map(Number);
  const d = new Date(y, m-1 + Number(months), 1);
  return toYM(d.getFullYear(), d.getMonth()+1);
}
function firstLabelValue(text, labels, maxLen=180) {
  const lines = normalizeText(text).split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const labs = labels.map(l=>stripAccents(l).toLowerCase());
  for(let i=0;i<lines.length;i++) {
    const raw = lines[i];
    const low = stripAccents(raw).toLowerCase();
    for(const lab of labs) {
      if(low.includes(lab)) {
        let v = raw.replace(new RegExp('^.*?'+lab.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*[:;\\-–—]?\\s*','i'), '');
        v = cleanExtracted(v);
        if(v && stripAccents(v).toLowerCase() !== lab && v.length <= maxLen) return v;
        if(lines[i+1] && lines[i+1].length <= maxLen) return cleanExtracted(lines[i+1]);
      }
    }
  }
  return '';
}
function guessTitle(text) {
  const byLabel = firstLabelValue(text, ['título do projeto','titulo do projeto','nome do projeto','objeto','projeto'], 220);
  if(byLabel && byLabel.length > 8) return byLabel;
  const lines = normalizeText(text).split(/\n+/).map(cleanExtracted).filter(x=>x.length>12 && x.length<180);
  const good = lines.find(l=>/desenvolvimento|avalia[cç][aã]o|valida[cç][aã]o|estudo|pesquisa|motor|sistema|projeto/i.test(l));
  return good || (lines[0] || '');
}
function guessName(fullName, text) {
  const explicit = firstLabelValue(text, ['sigla','acrônimo','acronimo'], 40);
  if(explicit) return explicit.replace(/[^A-Za-z0-9À-ÿ\- ]/g,'').trim().slice(0,32);
  const caps = (fullName.match(/\b[A-ZÁÉÍÓÚÂÊÔÃÕÇ0-9]{2,}(?:[-\/][A-ZÁÉÍÓÚÂÊÔÃÕÇ0-9]{2,})?\b/g)||[])
    .filter(x=>!['UFSM','CNPJ','CPF','CEP','R$'].includes(x));
  if(caps.length) return caps[0].slice(0,32);
  return fullName.split(/\s+/).filter(w=>w.length>3).slice(0,3).map(w=>w[0]).join('').toUpperCase() || 'NOVO';
}
function guessFunder(text) {
  const v = firstLabelValue(text, ['financiador','financiadora','contratante','concedente','patrocinador'], 180);
  if(v) return v;
  const known = ['Petrobras','FAURGS','FINEP','CNPq','CAPES','EMBRAPII','Volkswagen','VW','Silenkar','Raízen','FDMS','Aramco'];
  return known.filter(k=>new RegExp(k,'i').test(text)).slice(0,2).join(' / ');
}
function guessSupportFoundation(text) {
  const v = firstLabelValue(text, ['fundação de apoio','fundacao de apoio','interveniente financeira','fundação executora','fundacao executora'], 160);
  if(v) return v;
  const known = ['FDMS','FAURGS','FUNDEP','FATEC','FAPEU'];
  return known.find(k=>new RegExp(k,'i').test(text)) || '';
}
function guessLead(text) {
  const v = firstLabelValue(text, ['coordenador','coordenação','coordenacao','responsável técnico','responsavel tecnico','pesquisador responsável','pesquisador responsavel'], 160);
  if(v) return v;
  const m = text.match(/(?:Prof\.?\s*(?:Dr\.?|Dra\.?)?\s*)?([A-ZÁÉÍÓÚÂÊÔÃÕÇ][a-záéíóúâêôãõç]+(?:\s+[A-ZÁÉÍÓÚÂÊÔÃÕÇ][a-záéíóúâêôãõç]+){1,4})\s*(?:,|\n)?\s*(?:coordenador|respons[aá]vel)/i);
  return m ? cleanExtracted(m[1]) : '';
}
function guessDates(text) {
  const vig = text.match(/vig[eê]ncia[^\n\r]{0,160}/i)?.[0] || '';
  const dates = (vig || text).match(/(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}|\d{4}[\/\-.]\d{1,2}|(?:janeiro|fevereiro|mar[cç]o|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\s+(?:de\s+)?\d{4})/ig) || [];
  let start = '', end = '';
  if(dates.length>=1) start = parseDateToYM(dates[0]);
  if(dates.length>=2) end = parseDateToYM(dates[1]);
  if(!start) start = parseDateToYM(firstLabelValue(text, ['data de início','data de inicio','início','inicio'], 80));
  if(!end)   end   = parseDateToYM(firstLabelValue(text, ['data de término','data de termino','fim','encerramento'], 80));
  const dur = text.match(/(?:prazo|vig[eê]ncia|dura[cç][aã]o)[^\n\r]{0,80}?(\d{1,3})\s*mes(?:es)?/i);
  if(start && !end && dur) end = addMonthsYM(start, Number(dur[1]));
  return {start, end};
}
function inferStatus(text) {
  const low = stripAccents(text).toLowerCase();
  if(/atras|penden|critico|nao recebido|sem ensaio|sem infraestrutura|risco/.test(low)) return 'yellow';
  if(/finaliza|encerr/.test(low)) return 'yellow';
  if(/em execucao|em andamento|vigente|assinado|formalizado/.test(low)) return 'green';
  return 'gray';
}
function extractProjectFromText(raw) {
  const text = normalizeText(raw);
  const fullName = guessTitle(text);
  const dates = guessDates(text);
  const funder = guessFunder(text);
  const supportFoundation = guessSupportFoundation(text);
  const lead = guessLead(text);
  const value = parseMoney(text);
  const phase = firstLabelValue(text, ['fase atual','fase','etapa atual','situação','situacao'], 120) || (inferStatus(text)==='green'?'Em execução':'A revisar');
  const notesParts = [];
  if(!value) notesParts.push('Valor não identificado automaticamente.');
  if(!dates.start || !dates.end) notesParts.push('Vigência não identificada completamente.');
  if(!funder) notesParts.push('Financiador não identificado automaticamente.');
  if(!supportFoundation) notesParts.push('Fundação de apoio não identificada automaticamente.');
  const pend = (text.match(/(?:pend[eê]ncias?|atraso|risco|aguardando|n[aã]o recebido|em discuss[aã]o)[^\.\n]{0,160}/ig)||[]).slice(0,3);
  if(pend.length) notesParts.push(pend.map(cleanExtracted).join(' | '));
  return {
    id: newId(),
    name: guessName(fullName, text),
    fullName: fullName || '',
    funder: funder || '',
    supportFoundation: supportFoundation || '',
    value: value || 0,
    start: dates.start || '2026-01',
    end: dates.end || '2027-12',
    status: inferStatus(text),
    lead: lead || '',
    phase,
    notes: notesParts.join(' '),
    ph: false
  };
}

function guessSubmissionDeadline(text){
  const direct = firstLabelValue(text, ['prazo de submissão','data limite','limite para submissão','encerramento das submissões','submissão até','submissao ate'], 80);
  const d = parseDateToYM(direct);
  if(d) return d;
  const line = (text.match(/(?:submiss[aã]o|proposta|edital|chamada|data limite)[^\n\r]{0,140}/i)||[])[0] || '';
  const m = line.match(/(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}|\d{4}[\/\-.]\d{1,2})/);
  return m ? parseDateToYM(m[1]) : '';
}
function extractSubmissionFromText(raw){
  const text = normalizeText(raw);
  const p = extractProjectFromText(text);
  const edital = firstLabelValue(text, ['edital','chamada','chamada pública','chamada publica','programa','linha'], 160) || p.fullName || p.name;
  const objective = firstLabelValue(text, ['objetivo','objeto','resumo','descrição','descricao'], 260);
  const deadline = guessSubmissionDeadline(text);
  const req = (text.match(/(?:anexo|documentos?|contrapartida|elegibilidade|prazo|limite|or[cç]amento|bolsas?)[^\.\n]{0,180}/ig)||[])
    .slice(0,5).map(cleanExtracted).join(' | ');
  return {
    name: p.name || guessName(edital||'EDITAL', text),
    title: edital || '',
    funder: p.funder || '',
    value: p.value || 0,
    deadline,
    start: p.start || '',
    end: p.end || '',
    lead: p.lead || '',
    objective: objective || '',
    notes: [p.notes, req].filter(Boolean).join(' '),
    sourceFile: UI.subArquivo || ''
  };
}

function submissionMatrixSuggestions(sub){
  if(!sub) return {filters:null,scores:null,efforts:null};
  const text = stripAccents(normalizeText([
    sub.name, sub.title, sub.funder, sub.objective, sub.notes, sub.raw
  ].filter(Boolean).join(' '))).toLowerCase();
  const has = re => re.test(text);
  const filters = {};
  DM_FILTERS.forEach(f=>filters[f.id]='pass');
  if(has(/fora do escopo|nao aderente|sem alinhamento/)) filters.f_align='fail';
  if(!sub.lead && has(/responsavel nao definido|sem coordenador|coordenador indefinido/)) filters.f_resp='fail';
  if(has(/infraestrutura indisponivel|sem infraestrutura|banco indisponivel/)) filters.f_infra='fail';
  if(has(/prazo incompativel|inexequivel|nao exequivel/)) filters.f_prazo='fail';
  if(has(/sem recurso minimo|orcamento insuficiente|nao cobre custos/)) filters.f_recurso='fail';
  if(has(/risco reputacional (alto|inaceitavel)|nao aceitavel/)) filters.f_risco='fail';

  const scores = {
    c_lin: has(/motor|combust|etanol|biodiesel|hidrogen|h2|emissoes|dinamometr|energia|termic/) ? 5 : 3,
    c_part: has(/finep|cnpq|petrobras|brics|fapesp|capes|embrapii|internacional|multilateral/) ? 4 : 3,
    c_sin: has(/etanol|flex|motor|combust|h2|hidrogen|biodiesel|projetos existentes|sinergia/) ? 4 : 3,
    c_inov: has(/inov|desenvolv|pesquisa|experimental|demonstrador|tecnolog/) ? 4 : 3,
    c_form: has(/bolsa|bolsista|alun|estudante|formacao|capacita|recursos humanos/) ? 4 : 3,
    c_pub: has(/publica|artigo|propriedade intelectual|patente|demonstracao|relatorio tecnico/) ? 4 : 3,
    c_inst: has(/ufsm|gpmot|internacional|brics|cooperacao|rede|parceria/) ? 4 : 3,
    c_vol: (sub.value||0)>=2000000 ? 5 : ((sub.value||0)>=1000000 ? 4 : ((sub.value||0)>=300000 ? 3 : 2)),
    c_eq: has(/bolsa|equipe dedicada|equipe tecnica|pesquisador|alun/) ? 4 : 3,
    c_man: has(/insumo|manutencao|equipamento|infraestrutura|ensaio|banco|orcamento/) ? 4 : 3,
    c_cp: has(/contrapartida.*(alta|significativa|obrigatoria)|recurso proprio/) ? 2 : (has(/contrapartida.*(minima|baixa)|cobre custos/) ? 4 : 3),
    c_deq: has(/equipe dedicada|equipe disponivel|bolsa/) ? 4 : (has(/dependencia de equipe|gargalo|pessoas-chave/) ? 2 : 3),
    c_dinf: has(/infraestrutura disponivel|banco disponivel|laboratorio disponivel/) ? 4 : (has(/sem infraestrutura|infraestrutura indisponivel/) ? 1 : 3),
    c_rtec: has(/risco tecnico alto|alta incerteza tecnica/) ? 2 : (has(/risco tecnico baixo|baixo risco tecnico/) ? 4 : 3),
    c_radm: has(/internacional|multilateral|dados entre paises|dependencia.*paises|compras criticas|importacao/) ? 2 : 3,
    c_rrep: has(/risco reputacional aceitavel|baixo risco reputacional/) ? 4 : (has(/risco reputacional/) ? 3 : 4)
  };
  const efforts = {
    e_coord: has(/internacional|multilateral|coordenacao internacional|pessoas-chave|gargalo/) ? 4 : 3,
    e_team: has(/equipe dedicada|bolsas|bolsistas|pesquisadores|engenheiros/) ? 3 : 2,
    e_infra: has(/banco|dinamometr|ensaio|instrumentacao|emissoes|cfd|gt-power|scanner/) ? 4 : 2,
    e_adm: has(/internacional|multilateral|dados entre paises|contrapartida|compras|importacao|prestacao de contas/) ? 4 : 3
  };
  return {filters,scores,efforts};
}

    ${sel('entProj', [['', 'Todos os projetos'], ...optProjetos()], pj)}

    : '<div class="empty">Nenhuma entrega neste filtro.</div>'}`;

VIEWS.tarefas = () => {
  const f = UI.f;
  if (f.tfEscopo === undefined) f.tfEscopo = ME.pessoa_id ? 'minhas' : '';
  const esc_ = f.tfEscopo, st = f.tfStatus || 'abertas', q = norm(f.tfBusca);
  let list = D.tarefas.slice();
  if (esc_ === 'minhas') list = list.filter(t => D.tarefa_responsaveis.some(r => r.tarefa_id === t.id && r.pessoa_id === ME.pessoa_id));
  if (esc_ === 'atrasadas') list = list.filter(Calc.atrasada);
  if (esc_ === 'semresp') list = list.filter(t => !D.tarefa_responsaveis.some(r => r.tarefa_id === t.id));
  if (st !== 'todas') list = list.filter(t => st === 'abertas' ? !t.concluida : t.concluida);
  if (f.tfProjeto) list = list.filter(t => t.projeto_id === f.tfProjeto);
  if (f.tfGerencia) list = list.filter(t => t.gerencia_id === f.tfGerencia);
  if (f.tfPessoa) list = list.filter(t => D.tarefa_responsaveis.some(r => r.tarefa_id === t.id && r.pessoa_id === f.tfPessoa));
  if (q) list = list.filter(t => norm(t.titulo + ' ' + (t.descricao || '')).includes(q));

    ${sel('tfProjeto', optProjetos(), 'Todos os projetos')} ${sel('tfGerencia', optGerencias(), 'Todas as gerências')} ${sel('tfPessoa', optPessoas(), 'Qualquer responsável')}
    <input id="tfBusca" data-f="tfBusca" placeholder="Buscar…" value="${esc(f.tfBusca || '')}" style="min-width:140px"></div>
    <div class="row"><button class="chip${vis === 'lista' ? ' on' : ''}" data-a="sub" data-g="tarefas" data-v="lista">Lista</button><button class="chip${vis === 'gantt' ? ' on' : ''}" data-a="sub" data-g="tarefas" data-v="gantt">Gantt</button>
    ${Perm.podeEditar() ? `<button class="btn-p" data-a="tarefaNova">+ Nova tarefa</button>` : ''}</div></div>
  <div class="small muted mb">${list.length} tarefa(s)</div>
  ${vis === 'lista' ? `<div class="card">${listaTarefas(list)}</div>` : ganttTarefas(list)}`;

/* ════════════════════════════════════════════════════════════════════
   FINANCEIRO — orçamento por rubricas, despesas e bolsas
   ════════════════════════════════════════════════════════════════════ */
A.finAbrir = d => { UI.tab = 'financeiro'; UI.f.finProj = d.id; UI.sub.fin = 'orcamento'; UI.projeto = null; window.scrollTo(0, 0); render(); };
const SUBS_FIN = [['resumo', 'Resumo geral'], ['compras', 'Compras e aquisições'], ['calendario', 'Calendário de bolsas'], ['orcamento', 'Orçamento por rubrica'], ['plano', 'Plano de aplicação'], ['desembolso', 'Desembolso'], ['despesas', 'Despesas'], ['bolsas', 'Bolsas e pagamentos']];
const GERAIS_FIN = ['resumo', 'compras', 'calendario'];
VIEWS.financeiro = () => {
  const projs = D.projetos.filter(p => Perm.veFin(p.id)).sort(byName('sigla'));
  if (!projs.length) return '<div class="empty">Você não tem acesso ao financeiro de nenhum projeto.</div>';

  let pid = UI.f.finProj; if (!projs.some(p => p.id === pid)) pid = UI.f.finProj = projs[0].id;
