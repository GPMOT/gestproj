<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPMOT/UFSM — Gestão de Portfólio</title>
<style>
:root{
  --bg:#eceae3; --card:#fff; --soft:#f5f4f0; --line:#e0ddd6; --line2:#d0cec8;
  --txt:#1c1c1a; --muted:#7a7975; --faint:#9b9b98;
  --blue:#1a5ca8; --blue-bg:#e6f1fb; --blue-txt:#0c447c;
  --green:#3b6d11; --green-bg:#eaf3de; --green-txt:#27500a;
  --yellow:#ba7517; --yellow-bg:#faeeda; --yellow-txt:#633806;
  --red:#c43030; --red-bg:#fcebeb; --red-txt:#a32d2d;
  --gray-bg:#f0ede8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
#app{max-width:1280px;margin:0 auto;padding:18px 24px 60px}
input,select,textarea,button{font-family:inherit;font-size:13px;color:var(--txt);outline:none}
input,select,textarea{background:#fff;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
input:focus,select:focus,textarea:focus{border-color:#378add;box-shadow:0 0 0 3px rgba(55,138,221,.12)}
textarea{resize:vertical}
button{cursor:pointer;background:#fff;border:1px solid #c8c6c0;border-radius:7px;padding:5px 12px;white-space:nowrap}
button:hover{background:var(--soft)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)} .btn-p:hover{background:#155096}
.btn-d{color:var(--red-txt);border-color:#e4b5b5} .btn-d:hover{background:var(--red-bg)}
.btn-s{padding:3px 9px;font-size:12px}
.link{background:none;border:none;padding:0;color:var(--txt);font-weight:600;text-align:left;cursor:pointer}
.link:hover{color:var(--blue);text-decoration:underline;background:none}

/* ── estrutura: menu lateral fixo + conteúdo ─────────────────── */
:root{--sw:248px;--side-bg:#20242a;--side-bg2:#2b3038;--side-txt:#c9cdd3;--side-faint:#8b929c}
body{padding-left:var(--sw);transition:padding-left .15s}
body.side-mini{--sw:64px}
body.no-side{padding-left:0} body.no-side #side{display:none}
#side{position:fixed;top:0;left:0;bottom:0;width:var(--sw);background:var(--side-bg);color:var(--side-txt);display:flex;flex-direction:column;z-index:40;transition:width .15s,transform .2s}
.nv-top{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:14px 12px 12px 14px;border-bottom:1px solid #30353d;flex:none}
.nv-brand{display:flex;align-items:center;gap:10px;min-width:0;font-size:13px;line-height:1.25;color:#fff}
.nv-brand span span{font-size:11px;color:var(--side-faint)}
.nv-logo{width:32px;height:32px;border-radius:9px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.nv-mini{background:transparent;border:1px solid #3a4049;color:var(--side-faint);padding:2px 8px;font-size:13px;border-radius:6px}
.nv-mini:hover{background:var(--side-bg2);color:#fff}
.nv-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 8px 16px;scrollbar-width:thin;scrollbar-color:#454b55 transparent}
.nv-scroll::-webkit-scrollbar{width:8px} .nv-scroll::-webkit-scrollbar-thumb{background:#454b55;border-radius:8px}
.nv-g{margin-bottom:6px}
.nv-gt{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--side-faint);padding:12px 10px 5px}
.nv-item{display:flex;align-items:center;border-radius:8px;position:relative}
.nv-item:hover{background:var(--side-bg2)}
.nv-item.on{background:#323945} .nv-item.on::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:#5b9be8}
.nv-a{flex:1;display:flex;align-items:center;gap:11px;background:transparent;border:none;color:inherit;padding:8px 10px;font-size:13.5px;text-align:left;min-width:0;border-radius:8px}
.nv-a:hover{background:transparent;color:#fff} .nv-item.on .nv-a{color:#fff;font-weight:600}
.nv-a svg{flex:none;opacity:.9}
.nv-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nv-tg{background:transparent;border:none;color:var(--side-faint);padding:4px 9px;font-size:12px}
.nv-tg:hover{background:transparent;color:#fff}
.nv-subs{margin:2px 0 6px 21px;padding-left:10px;border-left:1px solid #3a4049}
.nv-s{display:flex;align-items:center;gap:7px;width:100%;background:transparent;border:none;color:var(--side-txt);padding:5px 8px;font-size:12.5px;text-align:left;border-radius:6px}
.nv-s:hover{background:var(--side-bg2);color:#fff} .nv-s.on{background:#34404f;color:#fff;font-weight:600}
.nv-sh{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--side-faint);padding:7px 8px 2px}
.nv-dot{width:7px;height:7px;border-radius:50%;flex:none}
.nv-n{font-size:10.5px;font-weight:700;min-width:19px;height:18px;padding:0 5px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:#3b4350;color:#dfe3e8}
.nv-n.bad{background:#c43030;color:#fff} .nv-n.warn{background:#ba7517;color:#fff} .nv-n.info{background:#1a5ca8;color:#fff}
.nv-foot{flex:none;border-top:1px solid #30353d;padding:10px 12px 12px;font-size:12px}
.nv-user{display:flex;align-items:center;gap:9px;line-height:1.3;color:#fff;margin-bottom:6px}
.nv-user .av{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:none}
.nv-user span span{color:var(--side-faint);font-size:11px}
.nv-mode{font-size:11px;color:#e3b565;margin-bottom:8px} .nv-mode.online{color:#8fd18b}
.nv-btn{width:100%;background:transparent;border:1px solid #3a4049;color:var(--side-txt);font-size:12px;padding:5px}
.nv-btn:hover{background:var(--side-bg2);color:#fff}
/* menu recolhido: só ícones */
body.side-mini .nv-l,body.side-mini .nv-gt,body.side-mini .nv-subs,body.side-mini .nv-tg,body.side-mini .nv-mode,body.side-mini .nv-btn{display:none}
body.side-mini .nv-top{flex-direction:column;padding:12px 8px} body.side-mini .nv-a{justify-content:center;padding:10px 0}
body.side-mini .nv-n{position:absolute;top:2px;right:4px;min-width:16px;height:15px;font-size:9.5px}
body.side-mini .nv-user{justify-content:center}
/* barra superior do conteúdo */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #dedad2}
.crumb{flex:1;display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700;min-width:0}
.crumb-a{font-size:19px;font-weight:600;color:var(--muted)} .crumb-s{color:#b5b2ab;font-weight:400}
.crumb-c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}
.hamb{display:none;font-size:18px;padding:3px 10px}
#nav-backdrop{display:none}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border-radius:16px;padding:4px 12px;font-size:12px}
.chip.on{background:var(--txt);color:#fff;border-color:var(--txt)}
@media (max-width:900px){
  body,body.side-mini{padding-left:0;--sw:264px}
  #side{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.35)}
  body.nav-open #side{transform:none}
  body.nav-open #nav-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
  body.side-mini .nv-l,body.side-mini .nv-gt,body.side-mini .nv-subs,body.side-mini .nv-tg,body.side-mini .nv-mode,body.side-mini .nv-btn{display:revert}
  .nv-mini{display:none}
  .hamb{display:inline-block}
  .crumb,.crumb-a{font-size:16px}
}

/* layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.metric{background:var(--soft);border-radius:9px;padding:11px 13px}
.metric .k{font-size:11px;color:var(--muted);margin-bottom:4px}
.metric .v{font-size:21px;font-weight:650}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px} .bold{font-weight:650}
.empty{padding:14px;color:var(--faint);font-style:italic;font-size:12.5px}
.note{font-size:12px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 10px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto;min-width:180px}
.mt{margin-top:12px} .mb{margin-bottom:12px}

/* badges */
.b{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid transparent;white-space:nowrap;line-height:1.5}
.b-green{background:var(--green-bg);color:var(--green-txt);border-color:#b7d69a}
.b-yellow{background:var(--yellow-bg);color:var(--yellow-txt);border-color:#efd29a}
.b-red{background:var(--red-bg);color:var(--red-txt);border-color:#eeb4b4}
.b-blue{background:var(--blue-bg);color:var(--blue-txt);border-color:#a9caed}
.b-gray{background:var(--gray-bg);color:#666;border-color:#dedad2}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid #eeebe5;vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#faf9f6}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.total td{font-weight:700;border-top:1.5px solid var(--txt)}
.tw{overflow-x:auto}

/* matrix */
.mx td{padding:3px;text-align:center}
.cell{width:100%;min-width:72px;font-size:11px;padding:5px 4px;border-radius:7px;border:1px solid #dedad2;line-height:1.2;white-space:normal}
.loadpill{font-weight:700;border-radius:6px;padding:3px 7px;display:inline-block;min-width:48px;text-align:center}

/* gantt */
.gantt{position:relative}
.g-row{display:flex;align-items:center;min-height:28px}
.g-lbl{width:120px;flex:none;font-size:12px;font-weight:600;padding-right:8px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-trk{position:relative;flex:1;height:24px;background:#f3f1ec;border-radius:5px}
.g-bar{position:absolute;top:2px;height:20px;border-radius:5px;border:1px solid;font-size:10.5px;padding:2px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.g-now{position:absolute;top:-3px;bottom:-3px;width:2px;background:#e24b4a;z-index:2}
.g-hdr{position:relative;flex:1;height:18px}
.g-yr{position:absolute;top:0;font-size:11px;font-weight:600;color:var(--muted);border-left:1px solid #d6d3cc;padding-left:4px;height:100%}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,20,18,.42);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:50;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:980px}
.modal h3{font-size:16px;margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fgrid .full{grid-column:1/-1}
.fl{font-size:11.5px;color:var(--muted);margin-bottom:3px;display:block}
.fl .req{color:var(--red)}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 0}
.checks label{display:flex;gap:5px;align-items:center;font-size:12.5px}
.mactions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mactions .left{margin-right:auto}
.merr{background:var(--red-bg);color:var(--red-txt);border:1px solid #eeb4b4;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:10px}
.help{font-size:11px;color:var(--faint);margin-top:2px}

/* flash */
#flash{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c1c1a;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:80;display:none;max-width:90vw}
#flash.err{background:var(--red)}

/* página do projeto: abas */
.ptabs{display:flex;gap:2px;border-bottom:1px solid #dedad2;margin-bottom:14px;overflow-x:auto}
.ptab{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;padding:7px 12px;color:var(--muted);font-size:13px;margin-bottom:-1px;display:inline-flex;align-items:center;white-space:nowrap;flex-shrink:0}
.ptab:hover{background:var(--soft);color:var(--txt)} .ptab.on{color:var(--txt);border-bottom-color:var(--blue);font-weight:600}
.fsec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);border-bottom:1px solid var(--line);padding:8px 0 3px;margin-top:4px}
.crtg{cursor:pointer;display:inline-block;width:14px;color:var(--muted)} .crtg:hover{color:var(--txt)}
/* orçamento */
.pbar{display:inline-block;width:70px;height:7px;background:#ebe8e1;border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:5px}
.pbar span{display:block;height:100%;border-radius:4px}
table.orc td{padding:5px 8px;vertical-align:middle} table.orc tr.grp td{background:#f6f4ef;font-weight:700}
table.orc tr.grp0 td{background:#ecebe5} table.orc td.cod{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
table.orc input.cin{width:130px;text-align:right;padding:4px 7px;font-variant-numeric:tabular-nums}
table.orc td.warn{background:#fff6e5} table.orc td.bad{background:#fdecec}
table.orc .execlink{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
/* misc */
.tag{display:inline-block;background:#f2f1ed;border:1px solid #e3e0da;border-radius:5px;font-size:11px;padding:1px 6px;margin:1px}
.pcard .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv .k{color:var(--muted)}
.task{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid #eeebe5}
.task.done .tt{text-decoration:line-through;color:var(--faint)}
.task .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.alert{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:8px;font-size:12.5px;margin-bottom:5px}
.alert.bad{background:var(--red-bg);color:var(--red-txt)} .alert.warn{background:var(--yellow-bg);color:var(--yellow-txt)} .alert.ok{background:var(--green-bg);color:var(--green-txt)}
.scale{display:flex;justify-content:space-between;font-size:10px;color:var(--faint)}
.crit{padding:6px 0;border-bottom:1px dashed #eee}
.crit .top{display:flex;gap:8px;align-items:center;font-size:12.5px}
.crit .top .lbl{flex:1} .crit .val{font-weight:700;width:18px;text-align:right}
input[type=range]{padding:0;border:none;box-shadow:none}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:4px 10px;font-size:12px}
.seg button.pass{background:var(--green-bg);color:var(--green-txt);font-weight:700}
.seg button.fail{background:var(--red-bg);color:var(--red-txt);font-weight:700}
.week{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:11.5px}
.week>div{background:#fff;padding:5px;min-height:38px}
.week .wh{background:var(--soft);font-weight:600;color:var(--muted);text-align:center;min-height:0}
.week .wi{font-weight:600;background:#faf9f6}
.rv{display:block;border-radius:5px;padding:2px 5px;margin-bottom:2px;cursor:pointer;font-size:10.5px;line-height:1.3}
.rv.sol{background:var(--yellow-bg);border:1px dashed #d9a441;color:var(--yellow-txt)}
.rv.conf{background:var(--blue-bg);border:1px solid #a9caed;color:var(--blue-txt)}
.rv.real{background:var(--green-bg);border:1px solid #b7d69a;color:var(--green-txt)}
.tree-child{padding-left:22px;position:relative}
.tree-child::before{content:'└';position:absolute;left:8px;color:#c8c6c0}

/* report */
#report{position:fixed;inset:0;background:#e6e4dd;z-index:60;overflow-y:auto;padding:20px}
#report .bar{max-width:880px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap}
#report .paper{max-width:880px;margin:0 auto;background:#fff;padding:36px 44px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
#report h1{font-size:22px} #report h2{font-size:16px;border-bottom:1.5px solid #1c1c1a;margin:22px 0 8px;padding-bottom:3px}
#report h3{font-size:13.5px;margin:12px 0 4px} #report p{margin:5px 0;font-size:13px}
#report table{width:100%;border-collapse:collapse;margin:6px 0;font-size:12px}
#report td,#report th{border:1px solid #bbb;padding:4px 7px;text-align:left;vertical-align:top}
#report th{background:#f0ede8}
@media print{
  body{padding-left:0!important} #side{display:none!important}
  body.printing #app,body.printing #side,body.printing #modal-root,body.printing #report .bar{display:none!important}
  body.printing #report{position:static;padding:0;background:#fff}
  body.printing #report .paper{box-shadow:none;padding:0;max-width:none}
}
@media (max-width:640px){ .fgrid{grid-template-columns:1fr} .g-lbl{width:78px} }
</style>
</head>
<body>
<aside id="side"></aside>
<div id="nav-backdrop" data-a="navMobile"></div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="flash"></div>
<script>
